<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#059669">
<title>FarmáciaGest — Gestão de escala da farmácia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3/dist/tabler-icons.min.css">
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<style>
/* ============================================================
   TOKENS — uma fonte da verdade para cor, espaço, tipo e sombra.
   Tema claro por padrão; escuro por preferência do sistema ou
   pelo botão (data-theme no <html> vence a mídia).
   ============================================================ */
:root{
  color-scheme:light;
  /* marca */
  --brand:#059669;--brand-strong:#047857;--brand-soft:#ecfdf5;--brand-line:#a7f3d0;--on-brand:#fff;
  --brand-solid:#047857;--brand-solid-hover:#035e46;
  --info:#0369a1;--info-soft:#eff6ff;--info-line:#bfdbfe;
  /* neutros */
  --ink:#0f172a;--muted:#5b6b7c;--bg:#f3f7f5;--surface:#fff;--surface-2:#f7faf9;
  --line:#e4ece9;--line-strong:#cfdad5;
  /* status */
  --ok:#15803d;--warn:#b45309;--warn-soft:#fef3c7;--warn-line:#fde68a;
  --danger:#dc2626;--danger-soft:#fef2f2;--danger-line:#fecaca;--danger-ink:#991b1b;
  /* escala de espaço (4pt, densidade de painel) */
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;
  /* raio e elevação */
  --r1:8px;--r2:10px;--r3:14px;--r4:18px;
  --sh1:0 1px 2px rgba(15,23,42,.05);
  --sh2:0 1px 2px rgba(15,23,42,.05),0 6px 18px rgba(15,23,42,.06);
  --sh3:0 20px 60px rgba(15,23,42,.28);
  --ring:0 0 0 3px rgba(5,150,105,.35);
  --scrim:rgba(15,23,42,.55);
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --brand:#34d399;--brand-strong:#6ee7b7;--brand-soft:#0f2a22;--brand-line:#1f5344;--on-brand:#04231a;
  --brand-solid:#34d399;--brand-solid-hover:#6ee7b7;
  --info:#7dd3fc;--info-soft:#0e2434;--info-line:#1e4a63;
  --ink:#e8f2ee;--muted:#9db0a8;--bg:#0a1310;--surface:#111d19;--surface-2:#16241f;
  --line:#233530;--line-strong:#31473f;
  --ok:#4ade80;--warn:#fbbf24;--warn-soft:#2a2110;--warn-line:#4d3c14;
  --danger:#f87171;--danger-soft:#2b1518;--danger-line:#5c2427;--danger-ink:#fca5a5;
  --sh1:0 1px 2px rgba(0,0,0,.4);
  --sh2:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);
  --sh3:0 20px 60px rgba(0,0,0,.6);
  --ring:0 0 0 3px rgba(52,211,153,.4);
  --scrim:rgba(0,0,0,.65);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --brand:#34d399;--brand-strong:#6ee7b7;--brand-soft:#0f2a22;--brand-line:#1f5344;--on-brand:#04231a;
    --brand-solid:#34d399;--brand-solid-hover:#6ee7b7;
    --info:#7dd3fc;--info-soft:#0e2434;--info-line:#1e4a63;
    --ink:#e8f2ee;--muted:#9db0a8;--bg:#0a1310;--surface:#111d19;--surface-2:#16241f;
    --line:#233530;--line-strong:#31473f;
    --ok:#4ade80;--warn:#fbbf24;--warn-soft:#2a2110;--warn-line:#4d3c14;
    --danger:#f87171;--danger-soft:#2b1518;--danger-line:#5c2427;--danger-ink:#fca5a5;
    --sh1:0 1px 2px rgba(0,0,0,.4);
    --sh2:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);
    --sh3:0 20px 60px rgba(0,0,0,.6);
    --ring:0 0 0 3px rgba(52,211,153,.4);
    --scrim:rgba(0,0,0,.65);
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--ink);background:var(--bg);letter-spacing:-.011em;-webkit-font-smoothing:antialiased;min-height:100dvh;touch-action:manipulation}
:where(button,a,input,select,textarea,[tabindex]):focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:var(--r1)}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}

/* ================= shell: header + navegação ================= */
header.top{background:var(--surface);border-bottom:1px solid var(--line);padding:var(--s3) var(--s4);display:flex;align-items:center;gap:var(--s3);position:sticky;top:0;z-index:30;padding-top:max(var(--s3),env(safe-area-inset-top))}
.logo{display:flex;align-items:center;gap:11px;font-weight:800;font-size:18px;letter-spacing:-.4px;min-width:0}
.logo .mark{width:36px;height:36px;border-radius:var(--r2);background:var(--brand-solid);color:var(--on-brand);display:grid;place-items:center;font-size:21px;flex:0 0 auto}
.logo small{display:block;font-weight:500;font-size:11.5px;color:var(--muted);letter-spacing:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-actions{margin-left:auto;display:flex;gap:var(--s2);align-items:center}
.icon-btn{width:40px;height:40px;border-radius:var(--r2);border:1px solid var(--line-strong);background:var(--surface);color:var(--muted);display:grid;place-items:center;font-size:19px;cursor:pointer;transition:background .15s,color .15s,border-color .15s}
.icon-btn:hover{background:var(--surface-2);color:var(--ink);border-color:var(--brand)}
nav.tabs{background:var(--surface);border-bottom:1px solid var(--line);display:flex;gap:2px;padding:0 var(--s3);overflow-x:auto;scrollbar-width:none;position:sticky;top:63px;z-index:29}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{background:none;border:none;color:var(--muted);font-family:inherit;font-weight:600;font-size:13.5px;padding:13px 14px;cursor:pointer;border-bottom:2.5px solid transparent;white-space:nowrap;display:flex;align-items:center;gap:6px;min-height:46px;transition:color .15s,border-color .15s}
nav.tabs button[aria-selected="true"]{color:var(--brand-strong);border-bottom-color:var(--brand)}
nav.tabs button:hover{color:var(--ink)}
.wrap{max-width:1080px;margin:0 auto;padding:var(--s5) var(--s4) calc(72px + env(safe-area-inset-bottom))}

/* ================= superfícies ================= */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r3);box-shadow:var(--sh2);padding:var(--s5);margin-bottom:var(--s4)}
.card h2{margin:0 0 var(--s1);font-size:16px;font-weight:700;display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap}
.card h2 .ti{color:var(--brand);font-size:20px}
.card .hint{color:var(--muted);font-size:13px;line-height:1.5;margin:0 0 var(--s4)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:var(--s3)}

/* ================= formulários ================= */
label.f{display:block;font-weight:600;font-size:12.5px;margin-bottom:5px;color:var(--ink)}
.f-wrap{display:flex;flex-direction:column}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line-strong);border-radius:var(--r2);font-size:16px;font-family:inherit;background:var(--surface);color:var(--ink);min-height:44px}
@media (min-width:641px){input,select,textarea{font-size:14px;min-height:42px}}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:var(--ring)}
input[type=checkbox]{min-height:0}

/* ================= botões ================= */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:none;border-radius:var(--r2);padding:11px 16px;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit;text-decoration:none;min-height:44px;transition:background .15s,color .15s,border-color .15s,transform .1s}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--brand-solid);color:var(--on-brand)}.btn-primary:hover{background:var(--brand-solid-hover)}
.btn-primary:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn-ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line-strong)}.btn-ghost:hover{background:var(--surface-2);border-color:var(--brand)}
.btn-danger{background:var(--surface);color:var(--danger);border:1px solid var(--danger-line)}.btn-danger:hover{background:var(--danger-soft)}
.btn-sm{padding:8px 12px;font-size:13px;min-height:40px;border-radius:var(--r2)}
.btn-icon{min-width:44px;padding-left:10px;padding-right:10px}
/* no toque e no telefone, todo alvo vai a 44px */
@media (pointer:coarse),(max-width:560px){.btn-sm{min-height:44px}.icon-btn{width:44px;height:44px}}
.row-actions{display:flex;gap:var(--s2);flex-wrap:wrap;margin-top:var(--s4)}

/* ================= importação ================= */
.drop{border:2px dashed var(--line-strong);border-radius:var(--r3);padding:22px;text-align:center;cursor:pointer;transition:border-color .15s,background .15s;background:var(--surface-2)}
.drop:hover,.drop.over{border-color:var(--brand);background:var(--brand-soft)}
.drop .ti{font-size:30px;color:var(--brand)}
.drop p{margin:8px 0 2px;font-weight:600;font-size:14px}
.drop small{color:var(--muted);font-size:12.5px}

/* ================= tags ================= */
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;background:var(--brand-soft);color:var(--brand-strong);border:1px solid var(--brand-line);white-space:nowrap}
.tag.gray{background:var(--surface-2);color:var(--muted);border-color:var(--line-strong)}
/* cores por categoria — atribuídas por índice, então categoria nova também ganha cor */
.tag.c0,.tag.balconista{background:var(--info-soft);color:var(--info);border-color:var(--info-line)}
.tag.c1,.tag.entregador{background:#fff7ed;color:#c2410c;border-color:#fed7aa}
.tag.c2,.tag.caixa{background:#faf5ff;color:#7e22ce;border-color:#e9d5ff}
.tag.c3{background:#fdf2f8;color:#be185d;border-color:#fbcfe8}
.tag.c4{background:#f0fdfa;color:#0f766e;border-color:#99f6e4}
.tag.c5{background:#fefce8;color:#a16207;border-color:#fde68a}
:root[data-theme="dark"] .tag.c1,:root[data-theme="dark"] .tag.entregador{background:#2a1a0d;color:#fdba74;border-color:#4d3016}
:root[data-theme="dark"] .tag.c2,:root[data-theme="dark"] .tag.caixa{background:#1f1430;color:#d8b4fe;border-color:#3d2560}
:root[data-theme="dark"] .tag.c3{background:#2b1121;color:#f9a8d4;border-color:#4d1f3a}
:root[data-theme="dark"] .tag.c4{background:#0d2724;color:#5eead4;border-color:#14504a}
:root[data-theme="dark"] .tag.c5{background:#2a2410;color:#fde047;border-color:#4d431a}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .tag.c1,:root:not([data-theme="light"]) .tag.entregador{background:#2a1a0d;color:#fdba74;border-color:#4d3016}
  :root:not([data-theme="light"]) .tag.c2,:root:not([data-theme="light"]) .tag.caixa{background:#1f1430;color:#d8b4fe;border-color:#3d2560}
  :root:not([data-theme="light"]) .tag.c3{background:#2b1121;color:#f9a8d4;border-color:#4d1f3a}
  :root:not([data-theme="light"]) .tag.c4{background:#0d2724;color:#5eead4;border-color:#14504a}
  :root:not([data-theme="light"]) .tag.c5{background:#2a2410;color:#fde047;border-color:#4d431a}
}
.tag.folga{background:var(--danger-soft);color:var(--danger-ink);border-color:var(--danger-line)}
.tag.troca{background:var(--warn-soft);color:var(--warn);border-color:var(--warn-line)}
.tag.extra{background:var(--info-soft);color:var(--info);border-color:var(--info-line)}

/* ================= tabelas ================= */
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line)}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);font-weight:700}
tr:last-child td{border-bottom:none}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r2)}
.tbl-wrap.scroll-y{max-height:min(70vh,620px);overflow-y:auto}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:26px 10px;font-size:14px;line-height:1.55}
.empty .ti{font-size:34px;display:block;margin-bottom:8px;color:var(--line-strong)}

/* ================= lista de funcionários ================= */
.emp-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:var(--s2)}
.emp{display:flex;align-items:center;gap:11px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r2);padding:11px 12px;cursor:pointer;transition:border-color .15s,background .15s;text-align:left;min-height:62px;font-family:inherit;color:inherit}
.emp:hover{border-color:var(--brand);background:var(--brand-soft)}
.emp .av{width:38px;height:38px;border-radius:var(--r2);background:var(--brand-solid);color:var(--on-brand);display:grid;place-items:center;font-weight:800;font-size:15px;flex:0 0 auto}
.emp .nm{flex:1;min-width:0}
.emp .nm b{display:block;font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.emp .nm span{font-size:12px;color:var(--muted)}
.search-wrap{position:relative;margin-bottom:var(--s3)}
.search-wrap .ti-search{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:18px;pointer-events:none}
.search-wrap input{padding-left:38px}

/* ================= escala do dia ================= */
.shift{border:1px solid var(--line);border-radius:var(--r3);margin-bottom:var(--s3);overflow:hidden}
.shift .head{display:flex;align-items:center;justify-content:space-between;gap:var(--s2);padding:11px 14px;background:var(--brand-soft);border-bottom:1px solid var(--brand-line)}
.shift .head b{font-size:14.5px}
.shift .head .time{font-size:12px;color:var(--brand-strong);font-weight:600;font-variant-numeric:tabular-nums}
.shift .body{padding:6px 14px}
.line{display:flex;align-items:center;gap:var(--s2);padding:9px 0;border-bottom:1px dashed var(--line)}
.line:last-child{border-bottom:none}
.line .nm{flex:1;font-weight:600;font-size:14px}
.line .hr{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.alert{display:flex;gap:var(--s2);align-items:flex-start;padding:12px 14px;border-radius:var(--r2);margin-bottom:var(--s2);font-size:13.5px;line-height:1.5}
.alert .ti{font-size:20px;flex:0 0 auto;margin-top:1px}
.alert.danger{background:var(--danger-soft);border:1px solid var(--danger-line);color:var(--danger-ink)}
.alert.ok{background:var(--brand-soft);border:1px solid var(--brand-line);color:var(--brand-strong)}
.alert.warn{background:var(--warn-soft);border:1px solid var(--warn-line);color:var(--warn)}
.alert.info{background:var(--info-soft);border:1px solid var(--info-line);color:var(--info)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.daybar{display:flex;align-items:flex-end;gap:var(--s2);flex-wrap:wrap;margin-bottom:var(--s2)}

/* resumo do dia */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:var(--s2);margin-top:var(--s3)}
.stat{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r2);padding:11px 13px}
.stat .v{font-size:22px;font-weight:800;line-height:1.15;font-variant-numeric:tabular-nums}
.stat .k{font-size:11.5px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:4px;margin-top:2px}
.stat.bad .v{color:var(--danger)}.stat.good .v{color:var(--ok)}

/* matriz de cobertura */
.cov td.cell{text-align:center;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.cov td.cell.ok{background:var(--brand-soft);color:var(--brand-strong)}
.cov td.cell.miss{background:var(--danger-soft);color:var(--danger-ink)}
.cov td.cell .ti{font-size:13px;vertical-align:-1px;margin-right:2px}

/* visão de semana */
.week{display:grid;grid-template-columns:repeat(7,minmax(104px,1fr));gap:var(--s1);min-width:760px}
.wday{border:1px solid var(--line);border-radius:var(--r2);background:var(--surface-2);padding:8px;text-align:left;cursor:pointer;font-family:inherit;color:inherit;transition:border-color .15s,background .15s}
.wday:hover{border-color:var(--brand);background:var(--brand-soft)}
.wday[aria-current="date"]{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
.wday .wd{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.wday .dt{font-size:15px;font-weight:800;font-variant-numeric:tabular-nums;margin:1px 0 6px}
.wday .wrow{display:flex;justify-content:space-between;gap:6px;font-size:11.5px;padding:2px 0;border-top:1px dashed var(--line);font-variant-numeric:tabular-nums}
.wday .wrow .wl{color:var(--muted);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wday .wrow .wv{font-weight:700}
.wday .wflag{margin-top:6px;font-size:10.5px;font-weight:700;display:flex;align-items:center;gap:3px;border-radius:6px;padding:2px 5px}
.wday .wflag.miss{background:var(--danger-soft);color:var(--danger-ink)}
.wday .wflag.hol{background:var(--warn-soft);color:var(--warn)}

/* semana / dia da pessoa */
.dow{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:var(--s2)}
.dow .d{border:1px solid var(--line);border-radius:var(--r1);padding:7px 4px;text-align:center;font-size:11.5px}
.dow .d b{display:block;font-size:11px;color:var(--muted);font-weight:700;margin-bottom:3px}
.dow .d.work{background:var(--brand-soft);border-color:var(--brand-line)}
.dow .d.off{background:var(--danger-soft);border-color:var(--danger-line);color:var(--danger-ink)}
.saldo{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
.saldo.pos{color:var(--ok)}.saldo.neg{color:var(--danger)}.saldo.zero{color:var(--muted)}
.kv{display:flex;justify-content:space-between;gap:var(--s3);padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv:last-child{border-bottom:none}
.kv .k{color:var(--muted);font-weight:600}
.kv .v{font-weight:700;text-align:right}

/* ================= escala mensal ================= */
table.grid-tally, table.grid-escala{border-collapse:separate;border-spacing:0;font-size:13px;min-width:max-content}
table.grid-tally th, table.grid-tally td, table.grid-escala th, table.grid-escala td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:7px 9px;background:var(--surface)}
table.grid-tally .stik, table.grid-escala .stik{position:sticky;left:0;z-index:2;text-align:left;min-width:150px;box-shadow:1px 0 0 var(--line)}
table.grid-tally thead th, table.grid-escala thead th{position:sticky;top:0;z-index:1;font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);font-weight:700;white-space:nowrap;box-shadow:0 1px 0 var(--line)}
table.grid-tally thead .stik, table.grid-escala thead .stik{z-index:3}
table.grid-escala th.dom{color:var(--danger)}
table.grid-escala thead th span{display:block;font-size:9px;font-weight:600;opacity:.7}
table.grid-escala td.cel{text-align:center;font-weight:700;font-size:11.5px;white-space:nowrap;min-width:34px}
.cel.turno{color:var(--ink)}
.cel.folga{background:var(--warn-soft);color:var(--warn)}
.cel.domingo{background:var(--brand-soft);color:var(--brand-dark)}
.cel.ferias{background:#dcfce7;color:#15803d}
.cel.feriado{background:var(--danger-soft);color:var(--danger)}
.cel.aniv{background:#f3e8ff;color:#7e22ce}
.cel.outro{background:var(--surface-2);color:var(--muted)}
.cel-leg{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;font-weight:600;border:1px solid var(--line)}
.cel-leg.folga{background:var(--warn-soft);color:var(--warn)}
.cel-leg.domingo{background:var(--brand-soft);color:var(--brand-dark)}
.cel-leg.ferias{background:#dcfce7;color:#15803d}
.cel-leg.feriado{background:var(--danger-soft);color:var(--danger)}
.cel-leg.aniv{background:#f3e8ff;color:#7e22ce}
.cel-leg.turno{background:var(--surface-2);color:var(--ink)}
:root[data-theme="dark"] .cel.ferias, :root[data-theme="dark"] .cel-leg.ferias{background:#14351f;color:#4ade80}
:root[data-theme="dark"] .cel.aniv, :root[data-theme="dark"] .cel-leg.aniv{background:#2a1840;color:#c084fc}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .cel.ferias,:root:not([data-theme="light"]) .cel-leg.ferias{background:#14351f;color:#4ade80}
:root:not([data-theme="light"]) .cel.aniv,:root:not([data-theme="light"]) .cel-leg.aniv{background:#2a1840;color:#c084fc}}

/* ================= recebimento ================= */
.prog{height:8px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--brand-solid);transition:width .3s}
.rec-item{display:flex;align-items:center;gap:var(--s3);padding:10px 12px;border:1px solid var(--line);border-radius:var(--r2);background:var(--surface-2);margin-bottom:6px}
.rec-item.feito{background:var(--brand-soft);border-color:var(--brand-line)}
.rec-item.feito .rec-nm b{text-decoration:line-through;opacity:.65}
.rec-chk{display:grid;place-items:center;width:44px;height:44px;flex:0 0 auto;cursor:pointer;margin:-6px 0 -6px -6px}
.rec-chk input{width:22px;height:22px;min-height:0;accent-color:var(--brand-solid);cursor:pointer}
.rec-nm{flex:1;min-width:0}
.rec-nm b{display:block;font-size:14px;font-weight:700;line-height:1.35}
.rec-nm .muted{font-size:12px}
.rec-item .btn-sm{flex:0 0 auto;min-width:44px;padding-left:10px;padding-right:10px}
@media(max-width:560px){.rec-item{flex-wrap:wrap}.rec-nm{flex:1 1 60%}}

/* ================= modal ================= */
.backdrop{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:flex-start;justify-content:center;padding:28px 14px;z-index:60;overflow-y:auto;animation:fade .16s ease-out}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r4);max-width:560px;width:100%;box-shadow:var(--sh3);margin:auto;animation:pop .18s ease-out}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
.modal .mh{display:flex;align-items:center;justify-content:space-between;gap:var(--s2);padding:var(--s4) var(--s5);border-bottom:1px solid var(--line)}
.modal .mh h3{margin:0;font-size:17px;display:flex;align-items:center;gap:var(--s2)}
.modal .mh h3 .ti{color:var(--brand)}
.modal .mh .x{background:none;border:none;font-size:22px;color:var(--muted);cursor:pointer;line-height:1;width:40px;height:40px;border-radius:var(--r2);display:grid;place-items:center;flex:0 0 auto}
.modal .mh .x:hover{background:var(--surface-2);color:var(--ink)}
.modal .mb{padding:var(--s5)}
.modal .mf{display:flex;gap:var(--s2);justify-content:flex-end;padding:var(--s3) var(--s5) var(--s4);border-top:1px solid var(--line);flex-wrap:wrap}
.days-pick{display:flex;flex-wrap:wrap;gap:6px}
.days-pick label{display:inline-flex;align-items:center;gap:5px;background:var(--surface-2);border:1px solid var(--line-strong);border-radius:var(--r1);padding:9px 11px;font-size:12.5px;font-weight:600;cursor:pointer;min-height:40px}
.days-pick input{width:auto}
.days-pick label:has(input:checked){background:var(--brand-soft);border-color:var(--brand);color:var(--brand-strong)}
.switch{display:inline-flex;align-items:center;gap:var(--s2);cursor:pointer;font-weight:600;font-size:13.5px;min-height:40px}
.switch input{width:auto}

/* ================= feedback ================= */
.toast{position:fixed;bottom:calc(22px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:12px 18px;border-radius:var(--r2);font-size:14px;font-weight:600;box-shadow:var(--sh3);z-index:90;max-width:90%;animation:pop .18s ease-out}
.toast.ok{background:var(--brand-strong);color:var(--on-brand)}
.toast.err{background:var(--danger);color:#fff}
.mini-tbl th,.mini-tbl td{padding:7px 8px;font-size:13px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3)}
@media(max-width:560px){.two{grid-template-columns:1fr}}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:var(--r2);overflow:hidden;background:var(--surface)}
.seg button{background:none;border:none;padding:9px 13px;font-family:inherit;font-weight:600;font-size:13px;cursor:pointer;color:var(--muted);min-height:40px;transition:background .15s,color .15s}
.seg button[aria-pressed="true"],.seg button.active{background:var(--brand-solid);color:var(--on-brand)}
.pos-num{color:var(--ok);font-weight:700;font-variant-numeric:tabular-nums}
.neg-num{color:var(--danger);font-weight:700;font-variant-numeric:tabular-nums}
.footer{color:var(--muted);font-size:12px;text-align:center;padding:var(--s3) 0 0;line-height:1.6}
.inline-add{display:flex;gap:var(--s2);flex-wrap:wrap;align-items:flex-end}
.inline-add .f-wrap{flex:1;min-width:150px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

@media(max-width:560px){
  .wrap{padding:var(--s4) var(--s3) calc(72px + env(safe-area-inset-bottom))}
  .card{padding:var(--s4);border-radius:var(--r2)}
  .logo{font-size:16.5px}
  nav.tabs{top:59px}
}

/* alvos de toque: reafirmado no fim para vencer as regras base acima */
@media (pointer:coarse),(max-width:560px){
  .seg button{min-height:44px}
  .btn-sm{min-height:44px}
  .icon-btn{width:44px;height:44px}
  .days-pick label{min-height:44px}
  .modal .mh .x{width:44px;height:44px}
}

/* ================= impressão: a escala vai pro balcão ================= */
@media print{
  @page{margin:14mm}
  header.top,nav.tabs,.footer,.btn,.icon-btn,.drop,.row-actions,.daybar,.search-wrap,#modalRoot{display:none!important}
  body{background:#fff;color:#000}
  .wrap{max-width:none;padding:0}
  .card{box-shadow:none;border:1px solid #ccc;break-inside:avoid;page-break-inside:avoid;margin-bottom:10px;padding:12px}
  .shift,.alert,.stat,.wday{break-inside:avoid;page-break-inside:avoid}
  .print-only{display:block!important}
}
.print-only{display:none}

  <div class="top-actions">

  </div>
</header>
<nav class="tabs" id="tabs" role="tablist" aria-label="Seções do app">

  <button data-tab="mensal" role="tab" aria-selected="false" aria-controls="tab-mensal" id="tb-mensal" tabindex="-1"><i class="ti ti-calendar-month" aria-hidden="true"></i> Escala mensal</button>
  <button data-tab="receb" role="tab" aria-selected="false" aria-controls="tab-receb" id="tb-receb" tabindex="-1"><i class="ti ti-package-import" aria-hidden="true"></i> Recebimento</button>
  <button data-tab="diverg" role="tab" aria-selected="false" aria-controls="tab-diverg" id="tb-diverg" tabindex="-1"><i class="ti ti-file-alert" aria-hidden="true"></i> Divergências</button>
  <button data-tab="config" role="tab" aria-selected="false" aria-controls="tab-config" id="tb-config" tabindex="-1"><i class="ti ti-settings" aria-hidden="true"></i> Configurações</button>

  <section id="tab-func" role="tabpanel" aria-labelledby="tb-func" tabindex="-1"></section>
  <section id="tab-dia" role="tabpanel" aria-labelledby="tb-dia" tabindex="-1" style="display:none"></section>

  <section id="tab-mensal" role="tabpanel" aria-labelledby="tb-mensal" tabindex="-1" style="display:none"></section>
  <section id="tab-receb" role="tabpanel" aria-labelledby="tb-receb" tabindex="-1" style="display:none"></section>

  <div class="footer">FarmáciaGest • os dados ficam salvos apenas neste navegador (localStorage). Use “Backup” nas Configurações para exportar.</div>
</div>
<div id="modalRoot"></div>

<script>
/* ================= util ================= */
const $=(s,r)=>(r||document).querySelector(s);
const $$=(s,r)=>Array.from((r||document).querySelectorAll(s));
function uid(){return 'id'+Math.random().toString(36).slice(2,9)+(seq++);}
let seq=0;
function loadLS(k,f){try{const v=JSON.parse(localStorage.getItem(k));return v==null?f:v;}catch(e){return f;}}
function saveLS(k,o){try{localStorage.setItem(k,JSON.stringify(o));}catch(e){}}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function norm(s){return String(s==null?'':s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();}
function toast(msg,type){const el=document.createElement('div');el.className='toast '+(type||'');el.setAttribute('role','status');el.setAttribute('aria-live','polite');el.textContent=msg;document.body.appendChild(el);setTimeout(()=>el.remove(),3200);}
function initials(nm){const p=String(nm||'?').trim().split(/\s+/);return ((p[0]||'?')[0]+(p.length>1?p[p.length-1][0]:'')).toUpperCase();}

const DOW=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
const DOW_S=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
function pad2(n){return String(n).padStart(2,'0');}
function todayStr(){const d=new Date();return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());}
function parseDate(s){const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s||'');if(!m)return null;return new Date(+m[1],+m[2]-1,+m[3]);}
function weekdayOf(s){const d=parseDate(s);return d?d.getDay():null;}
function fmtDateBR(s){const d=parseDate(s);if(!d)return s;return pad2(d.getDate())+'/'+pad2(d.getMonth()+1)+'/'+d.getFullYear();}
function fmtDateLong(s){const d=parseDate(s);if(!d)return s;return DOW[d.getDay()]+', '+pad2(d.getDate())+'/'+pad2(d.getMonth()+1)+'/'+d.getFullYear();}

/* ================= state ================= */
let FUNCS  = loadLS('fg_funcs',   []);
let TROCAS = loadLS('fg_trocas',  []);
let BANCO  = loadLS('fg_banco',   []);
let FERIAS = loadLS('fg_feriados',[]);
let TURNOS = loadLS('fg_turnos', [
  {id:'manha',nome:'Manhã',ini:'07:00',fim:'13:00'},
  {id:'tarde',nome:'Tarde',ini:'13:00',fim:'19:00'},
  {id:'noite',nome:'Noite',ini:'19:00',fim:'22:00'},
]);
let CATS = loadLS('fg_cats', [
  {id:'balconista',nome:'Balconista'},
  {id:'entregador',nome:'Entregador'},
  {id:'caixa',nome:'Operador de Caixa'},
]);
let MENSAL = loadLS('fg_mensal',  []); // escalas mensais importadas do Excel
let RECEB  = loadLS('fg_receb',   []); // itens a receber: {id,nome,dist,qtd,recebido,quando,obs,docId,nf}
let RECDOC = loadLS('fg_recdoc',  []); // documentos lidos: {id,arquivo,dist,nf,data,itens}
let DIVERG = loadLS('fg_diverg',  []); // divergências: {id,nf,produto,dist,qtd,motivo,nfDev,data,status}
let MINIMOS = loadLS('fg_minimos', {}); // MINIMOS[turnoId][catId] = n
function ensureMinimos(){
  TURNOS.forEach(t=>{ if(!MINIMOS[t.id])MINIMOS[t.id]={}; CATS.forEach(c=>{ if(MINIMOS[t.id][c.id]==null)MINIMOS[t.id][c.id]=1; }); });
}
ensureMinimos();
function saveAll(){
  saveLS('fg_funcs',FUNCS);saveLS('fg_trocas',TROCAS);saveLS('fg_banco',BANCO);
  saveLS('fg_feriados',FERIAS);saveLS('fg_turnos',TURNOS);saveLS('fg_cats',CATS);saveLS('fg_minimos',MINIMOS);
  saveLS('fg_receb',RECEB);saveLS('fg_recdoc',RECDOC);saveLS('fg_diverg',DIVERG);saveLS('fg_mensal',MENSAL);
}
const catName=id=>{const c=CATS.find(c=>c.id===id);return c?c.nome:'Sem categoria';};
const turnoOf=id=>TURNOS.find(t=>t.id===id)||null;
const turnoName=id=>{const t=turnoOf(id);return t?t.nome:'—';};
const funcById=id=>FUNCS.find(f=>f.id===id)||null;
// cor por posição na lista: categoria criada pelo usuário também ganha cor própria
function catClass(id){ const i=CATS.findIndex(c=>c.id===id); return i<0?'gray':('c'+(i%6)); }

/* ================= banco de horas ================= */
function saldoFunc(fid){
  const f=funcById(fid); let s=(f&&+f.saldoInicial)||0;
  BANCO.filter(b=>b.funcId===fid).forEach(b=>{s+=(+b.horas||0);});
  return Math.round(s*100)/100;
}
function fmtH(n){ const v=Math.round((+n||0)*100)/100; return (v>0?'+':'')+v+'h'; }

/* ================= escala do dia ================= */
// retorna {status:'trabalha'|'folga', turnoId, entrada, saida, motivo, trocaCom, trocaObs}
function baseSchedule(f,dateStr){
  const wd=weekdayOf(dateStr);
  const isHol=FERIAS.some(h=>h.data===dateStr);
  const folgas=f.folgas||[];
  if(folgas.includes(wd)) return {status:'folga',motivo:'Folga semanal',turnoId:f.turnoId,entrada:f.entrada,saida:f.saida};
  if(isHol && f.folgaFeriado) return {status:'folga',motivo:'Folga de feriado',turnoId:f.turnoId,entrada:f.entrada,saida:f.saida};
  return {status:'trabalha',turnoId:f.turnoId,entrada:f.entrada,saida:f.saida};
}
function daySchedule(dateStr){
  const map={};
  FUNCS.forEach(f=>{ map[f.id]=baseSchedule(f,dateStr); });
  // aplicar trocas (troca de horário/escala entre A e B naquele dia)
  TROCAS.filter(t=>(t.datas||[]).includes(dateStr)).forEach(t=>{
    const a=map[t.aId], b=map[t.bId];
    if(!a||!b)return;
    const na={status:b.status,turnoId:b.turnoId,entrada:b.entrada,saida:b.saida,motivo:b.motivo,trocaCom:t.bId,trocaObs:t.obs};
    const nb={status:a.status,turnoId:a.turnoId,entrada:a.entrada,saida:a.saida,motivo:a.motivo,trocaCom:t.aId,trocaObs:t.obs};
    map[t.aId]=na; map[t.bId]=nb;
  });
  return map;
}
// alertas de mínimo por turno/categoria
function shortages(dateStr){
  const map=daySchedule(dateStr);
  const count={}; // count[turnoId][catId]
  TURNOS.forEach(t=>count[t.id]={});
  FUNCS.forEach(f=>{
    const s=map[f.id];
    if(s.status!=='trabalha')return;
    const tid=s.turnoId; if(!count[tid])count[tid]={};
    count[tid][f.catId]=(count[tid][f.catId]||0)+1;
  });
  const out=[];
  TURNOS.forEach(t=>CATS.forEach(c=>{
    const min=(MINIMOS[t.id]&&MINIMOS[t.id][c.id])||0;
    const have=(count[t.id]&&count[t.id][c.id])||0;
    if(min>0 && have<min) out.push({turno:t.nome,cat:c.nome,have,min,falta:min-have});
  }));
  return {out,count};
}

/* ================= navegação ================= */
let activeTab='func';
const TABS=['func','dia','trocas','banco','mensal','receb','diverg','config'];
function selectTab(name,focus){
  activeTab=name;
  $$('#tabs button').forEach(x=>{
    const on=x.dataset.tab===name;
    x.setAttribute('aria-selected',on?'true':'false');
    x.tabIndex=on?0:-1;
    if(on){ x.scrollIntoView({block:'nearest',inline:'nearest'}); if(focus)x.focus(); }
  });
  TABS.forEach(t=>{ $('#tab-'+t).style.display = t===name?'':'none'; });
  render();
}
$$('#tabs button').forEach(b=>b.addEventListener('click',()=>selectTab(b.dataset.tab)));
// setas navegam entre abas (padrão de tablist)
$('#tabs').addEventListener('keydown',e=>{
  const k=e.key, i=TABS.indexOf(activeTab);
  let n=null;
  if(k==='ArrowRight')n=(i+1)%TABS.length;
  else if(k==='ArrowLeft')n=(i-1+TABS.length)%TABS.length;
  else if(k==='Home')n=0;
  else if(k==='End')n=TABS.length-1;
  if(n!==null){ e.preventDefault(); selectTab(TABS[n],true); }
});

/* ================= tema ================= */
function applyTheme(t){
  if(t==='auto'){ document.documentElement.removeAttribute('data-theme'); }
  else document.documentElement.setAttribute('data-theme',t);
  const escuro = t==='dark' || (t==='auto' && matchMedia('(prefers-color-scheme:dark)').matches);
  const ic=$('#themeIcon'); if(ic)ic.className='ti '+(escuro?'ti-sun':'ti-moon');
  const bt=$('#themeBtn'); if(bt)bt.setAttribute('aria-label',escuro?'Mudar para tema claro':'Mudar para tema escuro');
}
let TEMA=loadLS('fg_tema','auto');
applyTheme(TEMA);
$('#themeBtn').onclick=()=>{
  const escuro = TEMA==='dark' || (TEMA==='auto' && matchMedia('(prefers-color-scheme:dark)').matches);
  TEMA = escuro?'light':'dark';
  saveLS('fg_tema',TEMA); applyTheme(TEMA);
};
function render(){
  if(activeTab==='func')renderFunc();
  else if(activeTab==='dia')renderDia();
  else if(activeTab==='trocas')renderTrocas();
  else if(activeTab==='banco')renderBanco();
  else if(activeTab==='mensal')renderMensal();
  else if(activeTab==='receb')renderReceb();
  else if(activeTab==='diverg')renderDiverg();
  else if(activeTab==='config')renderConfig();
}

/* ================= modal ================= */
let _modalPrevFocus=null;
function openModal(title,icon,bodyHTML,footerHTML){
  const root=$('#modalRoot');
  _modalPrevFocus=document.activeElement;
  root.innerHTML='<div class="backdrop" id="bk"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle"><div class="mh"><h3 id="mTitle"><i class="ti '+icon+'" aria-hidden="true"></i> '+esc(title)+'</h3><button class="x" id="mx" type="button" aria-label="Fechar">&times;</button></div><div class="mb">'+bodyHTML+'</div>'+(footerHTML?('<div class="mf">'+footerHTML+'</div>'):'')+'</div></div>';
  $('#mx').onclick=closeModal;
  $('#bk').onclick=e=>{ if(e.target.id==='bk')closeModal(); };
  // foco entra no modal e fica preso nele enquanto aberto
  const foco=()=>$$('#modalRoot button,#modalRoot input,#modalRoot select,#modalRoot textarea,#modalRoot a[href]').filter(el=>!el.disabled&&el.offsetParent!==null);
  // nunca começa num botão destrutivo — o foco cai no primeiro campo/ação segura
  const cands=foco().filter(el=>el.id!=='mx'&&!el.classList.contains('btn-danger'));
  const alvo=cands[0]||$('#mx'); if(alvo)alvo.focus();
  $('#modalRoot').onkeydown=e=>{
    if(e.key==='Escape'){ e.preventDefault(); closeModal(); return; }
    if(e.key!=='Tab')return;
    const f=foco(); if(!f.length)return;
    const primeiro=f[0], ultimo=f[f.length-1];
    if(e.shiftKey && document.activeElement===primeiro){ e.preventDefault(); ultimo.focus(); }
    else if(!e.shiftKey && document.activeElement===ultimo){ e.preventDefault(); primeiro.focus(); }
  };
}
function closeModal(){
  $('#modalRoot').innerHTML=''; $('#modalRoot').onkeydown=null;
  if(_modalPrevFocus&&document.contains(_modalPrevFocus))_modalPrevFocus.focus();
  _modalPrevFocus=null;
}

/* ================= banco de dados de teste =================
   Cria uma farmácia fictícia completa para experimentar o app.
   Tudo que nasce aqui leva demo:true e sai junto no "Remover dados de teste";
   os registros reais nunca são tocados. */
function dPlus(n){ const d=new Date(); d.setDate(d.getDate()+n); return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
// se a categoria/turno padrão tiver sido renomeada ou apagada, cai na que existir
function demoCat(pref,i){ const c=CATS.find(c=>c.id===pref)||CATS[i%(CATS.length||1)]; return c?c.id:pref; }
function demoTurno(pref,i){ const t=turnoOf(pref)||TURNOS[i%(TURNOS.length||1)]; return t||{id:pref,ini:'07:00',fim:'13:00'}; }

const DEMO_PESSOAS=[
  // nome, categoria, turno, folgas (0=dom), horaExtra, folgaFeriado, saldo inicial
  ['Ana Beatriz Ramos',   'balconista','manha',[0],   false,true ,  0],
  ['Carla Mendonça',      'balconista','manha',[3],   true ,false,  2.5],

function downloadModelo(){
  const aoa=[
    ['Nome','Categoria','Turno','Entrada','Saída','Folga semanal','Hora extra','Folga feriado'],
    ['Maria Silva','Balconista','Manhã','07:00','13:00','Domingo','Não','Sim'],
    ['João Souza','Entregador','Tarde','13:00','19:00','Segunda','Sim','Não'],
    ['Ana Costa','Operador de Caixa','Noite','19:00','22:00','Quarta, Domingo','Não','Sim'],
  ];
  const ws=XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols']=[{wch:20},{wch:18},{wch:10},{wch:10},{wch:10},{wch:18},{wch:11},{wch:12}];
  const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'Escala');
  XLSX.writeFile(wb,'modelo-escala-farmacia.xlsx');
}
function readWorkbook(file){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    const isCsv=/\.csv$/i.test(file.name);
    r.onload=()=>{ try{
      const wb = isCsv ? XLSX.read(r.result,{type:'string'}) : XLSX.read(new Uint8Array(r.result),{type:'array'});
      const sh = wb.Sheets[wb.SheetNames[0]];
      res(XLSX.utils.sheet_to_json(sh,{header:1,raw:true,defval:''}));
    }catch(e){rej(e);} };
    r.onerror=rej;
    if(isCsv)r.readAsText(file); else r.readAsArrayBuffer(file);
  });
}
function excelTimeToStr(v){
  if(v==null||v==='')return '';
  if(typeof v==='number'){
    if(v>0&&v<1){ const mins=Math.round(v*24*60); return pad2(Math.floor(mins/60))+':'+pad2(mins%60); }
    if(v>=100&&v<=2359){ return pad2(Math.floor(v/100))+':'+pad2(v%100); }
    if(v>=0&&v<=23)return pad2(v)+':00';
    return String(v);
  }
  const m=/(\d{1,2})\s*[:hH]\s*(\d{0,2})/.exec(String(v));
  if(m)return pad2(+m[1])+':'+pad2(+(m[2]||0));
  return String(v).trim();
}
function mapCatValue(v){
  const s=norm(v);
  if(!s)return '';
  if(/balcon|balcao/.test(s))return 'balconista';
  if(/entreg|motoboy|motoqueir|deliver|motoc/.test(s))return 'entregador';
  if(/caixa|operador de caixa|frente de caixa/.test(s))return 'caixa';
  const c=CATS.find(c=>norm(c.nome)===s||c.id===s); return c?c.id:'';
}
function mapTurnoValue(v){
  const s=norm(v);
  if(/manh|matut/.test(s))return TURNOS.find(t=>t.id==='manha')?.id||TURNOS[0]?.id;
  if(/tarde|vesper/.test(s))return TURNOS.find(t=>t.id==='tarde')?.id||TURNOS[0]?.id;
  if(/noit|notur/.test(s))return TURNOS.find(t=>t.id==='noite')?.id||TURNOS[0]?.id;
  const t=TURNOS.find(t=>norm(t.nome)===s||t.id===s); return t?t.id:'';
}
function mapDays(v){
  const s=norm(v); if(!s)return [];
  const out=new Set();
  const keys=[['dom',0],['seg',1],['ter',2],['qua',3],['qui',4],['sex',5],['sab',6]];
  s.split(/[,;\/e]| e |\s+/).map(x=>x.trim()).filter(Boolean).forEach(tok=>{
    if(/^\d$/.test(tok)){const n=+tok;if(n>=0&&n<=6)out.add(n);return;}
    for(const [k,i] of keys){ if(tok.startsWith(k)){out.add(i);return;} }
  });
  // texto contínuo
  keys.forEach(([k,i])=>{ if(s.includes(k))out.add(i); });
  return Array.from(out).sort();
}
function mapBool(v){ const s=norm(v); return /^(sim|s|x|1|true|verdadeiro|yes|y)$/.test(s)||/\bsim\b/.test(s); }

const FIELD_DEFS=[
  {key:'nome',label:'Nome',re:/nome|funcion|colaborad|servidor/},
  {key:'categoria',label:'Categoria',re:/categ|fun[cç][aã]o|cargo|setor|funcao/},
  {key:'turno',label:'Turno',re:/turno|per[ií]odo|periodo|escala/},
  {key:'entrada',label:'Entrada',re:/entrada|in[ií]cio|inicio|começa|comeca/},
  {key:'saida',label:'Saída',re:/sa[ií]da|saida|fim|t[eé]rmino|termino|termina/},
  {key:'folga',label:'Folga semanal',re:/folga|descanso|day ?off|dsr/},
  {key:'horaextra',label:'Hora extra',re:/hora ?extra|\bextra/},
  {key:'feriado',label:'Folga feriado',re:/feriado|folga.*feriad/},
];
async function handleImport(file){
  let rows;
  try{ rows=await readWorkbook(file); }
  catch(e){ toast('Não consegui ler o arquivo','err'); return; }
  rows=(rows||[]).filter(r=>r&&r.some(c=>String(c).trim()!==''));
  if(rows.length<1){ toast('Planilha vazia','err'); return; }
  // achar linha de cabeçalho (a que tem 'nome' ou a com mais texto)
  let hIdx=0,best=-1;
  for(let i=0;i<Math.min(rows.length,6);i++){
    const cells=rows[i].map(c=>norm(c));
    const hasNome=cells.some(c=>/nome|funcion|colaborad/.test(c));
    const score=cells.filter(c=>c&&/[a-z]/.test(c)).length + (hasNome?10:0);
    if(score>best){best=score;hIdx=i;}
  }
  const header=rows[hIdx].map(c=>String(c).trim());
  const data=rows.slice(hIdx+1).filter(r=>r.some(c=>String(c).trim()!==''));
  // guesses
  const guess={};
  FIELD_DEFS.forEach(fd=>{
    let idx=header.findIndex(h=>fd.re.test(norm(h)));
    guess[fd.key]= idx>=0? idx : -1;
  });
  openImportMapper(header,data,guess,file.name);
}
function openImportMapper(header,data,guess,fname){
  const colOpts=(sel)=>'<option value="-1">— nenhuma —</option>'+header.map((h,i)=>'<option value="'+i+'"'+(i===sel?' selected':'')+'>'+esc(h||('Coluna '+(i+1)))+'</option>').join('');
  let mapRows=FIELD_DEFS.map(fd=>'<tr><td style="font-weight:600">'+fd.label+(fd.key==='nome'?' *':'')+'</td><td><select class="mapSel" data-key="'+fd.key+'">'+colOpts(guess[fd.key])+'</select></td></tr>').join('');
  let body='<p class="hint" style="margin-top:0">Arquivo <b>'+esc(fname)+'</b> — '+data.length+' linha(s). Confira o mapeamento das colunas. Categoria, turno, dias e sim/não são reconhecidos automaticamente.</p>'
    +'<div class="tbl-wrap"><table class="mini-tbl"><thead><tr><th>Campo do app</th><th>Coluna da planilha</th></tr></thead><tbody>'+mapRows+'</tbody></table></div>'
    +'<div style="margin-top:14px"><label class="switch"><input type="checkbox" id="impUpsert" checked> Atualizar funcionários com o mesmo nome (evita duplicados)</label></div>'
    +'<div id="impPreview" style="margin-top:12px"></div>';
  const footer='<button class="btn btn-ghost btn-sm" onclick="closeModal()">Cancelar</button><button class="btn btn-primary btn-sm" id="impGo"><i class="ti ti-download"></i> Importar</button>';
  openModal('Importar escala','ti-file-spreadsheet',body,footer);
  function buildRecords(){
    const m={}; $$('.mapSel').forEach(s=>m[s.dataset.key]=+s.value);
    const recs=[];
    data.forEach(r=>{
      const get=k=> m[k]>=0? r[m[k]] : '';
      const nome=String(get('nome')||'').trim();
      if(!nome)return;
      const turnoId=mapTurnoValue(get('turno'))||TURNOS[0]?.id||'';
      const t=turnoOf(turnoId);
      recs.push({
        nome,
        catId:mapCatValue(get('categoria')),
        turnoId,
        entrada:excelTimeToStr(get('entrada'))|| (t?t.ini:''),
        saida:excelTimeToStr(get('saida'))|| (t?t.fim:''),
        folgas:mapDays(get('folga')),
        horaExtra:mapBool(get('horaextra')),
        folgaFeriado:mapBool(get('feriado')),
        saldoInicial:0,
      });
    });
    return recs;
  }
  function refreshPreview(){
    const recs=buildRecords();
    let h='<div class="alert info"><i class="ti ti-eye"></i> Pré-visualização: '+recs.length+' funcionário(s) serão importados.</div>';
    if(recs.length){
      h+='<div class="tbl-wrap"><table class="mini-tbl"><thead><tr><th>Nome</th><th>Categoria</th><th>Turno</th><th>Horário</th><th>Folga</th><th>H.Extra</th><th>Fer.</th></tr></thead><tbody>';
      recs.slice(0,8).forEach(x=>{
        h+='<tr><td>'+esc(x.nome)+'</td><td>'+(x.catId?esc(catName(x.catId)):'<span class="muted">?</span>')+'</td><td>'+esc(turnoName(x.turnoId))+'</td><td>'+esc(x.entrada)+'–'+esc(x.saida)+'</td><td>'+esc(folgasLabel(x.folgas).replace('Sem folga fixa','—'))+'</td><td>'+(x.horaExtra?'Sim':'—')+'</td><td>'+(x.folgaFeriado?'Sim':'—')+'</td></tr>';
      });
      h+='</tbody></table></div>';
      if(recs.length>8)h+='<div class="muted" style="font-size:12px;margin-top:6px">… e mais '+(recs.length-8)+' linha(s).</div>';
    }
    $('#impPreview').innerHTML=h;
  }
  $$('.mapSel').forEach(s=>s.onchange=refreshPreview);
  refreshPreview();
  $('#impGo').onclick=()=>{
    const recs=buildRecords();
    if(!recs.length){toast('Nada para importar','err');return;}
    const upsert=$('#impUpsert').checked;
    let add=0,upd=0;
    recs.forEach(rec=>{
      const ex= upsert ? FUNCS.find(f=>norm(f.nome)===norm(rec.nome)) : null;
      if(ex){ rec.saldoInicial=ex.saldoInicial||0; Object.assign(ex,rec); ex.id=ex.id||uid(); upd++; }
      else { rec.id=uid(); FUNCS.push(rec); add++; }
    });
    saveAll();closeModal();render();
    toast(add+' adicionado(s), '+upd+' atualizado(s)','ok');
  };
}

/* ---------- resumo do dia: quatro números que respondem "como está hoje?" ---------- */
function resumoDia(dia){
  if(!FUNCS.length)return '';
  const map=daySchedule(dia);
  const trab=FUNCS.filter(f=>map[f.id].status==='trabalha').length;
  const folga=FUNCS.length-trab;
  const falta=shortages(dia).out.reduce((s,o)=>s+o.falta,0);
  const trocas=TROCAS.filter(t=>(t.datas||[]).includes(dia)).length;
  return '<div class="stats">'
    +'<div class="stat good"><div class="v">'+trab+'</div><div class="k"><i class="ti ti-user-check" aria-hidden="true"></i> Trabalhando</div></div>'
    +'<div class="stat"><div class="v">'+folga+'</div><div class="k"><i class="ti ti-bed" aria-hidden="true"></i> De folga</div></div>'
    +'<div class="stat'+(falta?' bad':'')+'"><div class="v">'+falta+'</div><div class="k"><i class="ti ti-alert-triangle" aria-hidden="true"></i> Faltando</div></div>'
    +'<div class="stat"><div class="v">'+trocas+'</div><div class="k"><i class="ti ti-arrows-exchange" aria-hidden="true"></i> Trocas</div></div>'
    +'</div>';
}

/* ---------- visão de semana: onde estão os buracos, de relance ---------- */
function inicioSemana(s){ const d=parseDate(s)||new Date(); d.setDate(d.getDate()-d.getDay()); return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function cardSemana(ini){
  if(!FUNCS.length)return '<div class="card"><div class="empty"><i class="ti ti-calendar-off" aria-hidden="true"></i>Cadastre funcionários para ver a escala da semana.</div></div>';
  const hoje=todayStr();
  let h='<div class="card"><h2><i class="ti ti-layout-grid" aria-hidden="true"></i> Semana inteira</h2>'
    +'<p class="hint">Quantas pessoas por turno em cada dia. Toque num dia para abrir a escala completa dele.</p>'
    +'<div class="tbl-wrap" style="border:none;padding-bottom:2px"><div class="week">';
  for(let i=0;i<7;i++){
    const d=shiftDay(ini,i);
    const map=daySchedule(d);
    const falta=shortages(d).out.reduce((s,o)=>s+o.falta,0);
    const hol=FERIAS.find(x=>x.data===d);
    const wd=weekdayOf(d);
    h+='<button type="button" class="wday" data-d="'+d+'"'+(d===hoje?' aria-current="date"':'')
      +' aria-label="'+esc(fmtDateLong(d))+(falta?' — faltam '+falta+' pessoa(s)':' — cobertura completa')+'">'
      +'<div class="wd">'+DOW_S[wd]+(d===hoje?' · hoje':'')+'</div>'
      +'<div class="dt">'+esc(fmtDateBR(d).slice(0,5))+'</div>';
    TURNOS.forEach(t=>{
      const n=FUNCS.filter(f=>map[f.id].status==='trabalha'&&map[f.id].turnoId===t.id).length;
      h+='<div class="wrow"><span class="wl">'+esc(t.nome)+'</span><span class="wv'+(n===0?' neg-num':'')+'">'+n+'</span></div>';
    });
    if(falta)h+='<div class="wflag miss"><i class="ti ti-alert-triangle" aria-hidden="true"></i> faltam '+falta+'</div>';
    if(hol)h+='<div class="wflag hol"><i class="ti ti-confetti" aria-hidden="true"></i> '+esc(hol.nome)+'</div>';
    h+='</button>';
  }
  return h+'</div></div></div>';
}

/* ---------- vista de um dia ---------- */
function cardsDoDia(dia){
  const map=daySchedule(dia);
  const {out,count}=shortages(dia);
  let html='';

  if(FUNCS.length){
    // matriz turno × categoria: dá pra ver ONDE falta, não só que falta
    html+='<div class="card"><h2><i class="ti ti-shield-check" aria-hidden="true"></i> Cobertura mínima</h2>';
    html+=out.length===0
      ? '<div class="alert ok"><i class="ti ti-circle-check" aria-hidden="true"></i> Todas as categorias atingem o mínimo em todos os turnos neste dia.</div>'
      : '<div class="alert danger"><i class="ti ti-alert-triangle-filled" aria-hidden="true"></i><div><b>Desfalque em '+out.length+' ponto(s)</b> — as células em vermelho abaixo mostram onde reforçar.</div></div>';
    html+='<div class="tbl-wrap"><table class="cov"><caption class="sr-only">Pessoas escaladas por turno e categoria, comparadas ao mínimo exigido</caption>'
      +'<thead><tr><th scope="col">Turno</th>'+CATS.map(c=>'<th scope="col">'+esc(c.nome)+'</th>').join('')+'</tr></thead><tbody>';
    TURNOS.forEach(t=>{
      html+='<tr><th scope="row" style="font-size:13px;text-transform:none;letter-spacing:0;color:var(--ink)">'+esc(t.nome)
        +'<br><span class="muted num" style="font-size:11.5px;font-weight:600">'+esc(t.ini)+'–'+esc(t.fim)+'</span></th>';
      CATS.forEach(c=>{
        const min=(MINIMOS[t.id]&&MINIMOS[t.id][c.id])||0;
        const have=(count[t.id]&&count[t.id][c.id])||0;
        const falta=min>0&&have<min;
        html+='<td class="cell '+(falta?'miss':(min>0?'ok':''))+'">'
          +(falta?'<i class="ti ti-alert-triangle" aria-hidden="true"></i>':(min>0?'<i class="ti ti-check" aria-hidden="true"></i>':''))
          +have+(min>0?'<span class="muted" style="font-weight:600">/'+min+'</span>':'')
          +(falta?'<div style="font-size:10.5px;font-weight:700">faltam '+(min-have)+'</div>':'')+'</td>';
      });
      html+='</tr>';
    });
    html+='</tbody></table></div><p class="hint" style="margin:10px 0 0">Formato: escalados / mínimo. Ajuste os mínimos em Configurações.</p></div>';
  }

  if(FUNCS.length===0){
    return '<div class="card"><div class="empty"><i class="ti ti-calendar-off" aria-hidden="true"></i>Cadastre funcionários para ver a escala do dia.</div></div>';
  }

  // escalados por turno
  html+='<div class="card"><h2><i class="ti ti-list-check" aria-hidden="true"></i> Escalados para trabalhar</h2>';
  TURNOS.forEach(t=>{
    const working=FUNCS.filter(f=>map[f.id].status==='trabalha'&&map[f.id].turnoId===t.id)
      .sort((a,b)=>a.catId.localeCompare(b.catId)||a.nome.localeCompare(b.nome));
    html+='<div class="shift"><div class="head"><b><i class="ti ti-clock-hour-9" aria-hidden="true"></i> '+esc(t.nome)+'</b><span class="time">'+esc(t.ini)+' – '+esc(t.fim)+' · '+working.length+' pessoa(s)</span></div><div class="body">';
    if(working.length===0){ html+='<div class="line"><span class="muted">Ninguém escalado neste turno.</span></div>'; }
    else working.forEach(f=>{
      const s=map[f.id];
      let badges='<span class="tag '+catClass(f.catId)+'">'+esc(catName(f.catId))+'</span>';
      if(f.horaExtra)badges+=' <span class="tag extra"><i class="ti ti-clock-plus" aria-hidden="true"></i> H.extra</span>';
      if(s.trocaCom){ const o=funcById(s.trocaCom); badges+=' <span class="tag troca"><i class="ti ti-arrows-exchange" aria-hidden="true"></i> Troca c/ '+esc(o?o.nome.split(' ')[0]:'?')+'</span>'; }
      html+='<div class="line"><span class="nm">'+esc(f.nome)+'</span><span class="hr">'+esc(s.entrada||'—')+' – '+esc(s.saida||'—')+'</span></div><div style="padding:0 0 8px"><div class="chips">'+badges+(s.trocaObs?' <span class="muted" style="font-size:11.5px">'+esc(s.trocaObs)+'</span>':'')+'</div></div>';
    });
    html+='</div></div>';
  });
  html+='</div>';

  // folgas
  const off=FUNCS.filter(f=>map[f.id].status==='folga').sort((a,b)=>a.nome.localeCompare(b.nome));
  html+='<div class="card"><h2><i class="ti ti-bed" aria-hidden="true"></i> De folga <span class="tag gray">'+off.length+'</span></h2>';
  if(off.length===0)html+='<div class="muted" style="font-size:13.5px">Ninguém de folga.</div>';
  else{ html+='<div class="chips">'; off.forEach(f=>{ const s=map[f.id]; let extra='';
    if(s.trocaCom)extra=' <i class="ti ti-arrows-exchange" aria-hidden="true"></i>';
    html+='<span class="tag folga">'+esc(f.nome)+' · '+esc(s.motivo||'Folga')+extra+'</span>'; }); html+='</div>'; }
  html+='</div>';

  // trocas do dia
  const td=TROCAS.filter(t=>(t.datas||[]).includes(dia));
  if(td.length){
    html+='<div class="card"><h2><i class="ti ti-arrows-exchange" aria-hidden="true"></i> Trocas neste dia</h2>';
    td.forEach(t=>{ const a=funcById(t.aId),b=funcById(t.bId);
      html+='<div class="alert warn"><i class="ti ti-arrows-exchange" aria-hidden="true"></i><div><b>'+esc(a?a.nome:'?')+'</b> ⇄ <b>'+esc(b?b.nome:'?')+'</b>'+(t.obs?' — '+esc(t.obs):'')+'</div></div>'; });
    html+='</div>';
  }
  return html;
}
function shiftDay(s,delta){ const d=parseDate(s)||new Date(); d.setDate(d.getDate()+delta); return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }

/* ============================================================
   ABA: ESCALA MENSAL (importada do Excel do usuário)
   Lê a planilha no formato dele — matriz funcionário × dia, com
   turnos H01..H09, F (folga), * (domingo trabalhado), FÉRIAS
   (soletrado em verde) e FF/FA. Detecta cada situação pelo
   CONTEÚDO (o SheetJS não lê cor de célula; verificamos que o
   conteúdo reproduz a cor exatamente). No fim, conta quantas
   vezes cada funcionário fez cada turno.
   ============================================================ */
let buscaMen='', mesSelId=null;

// horários padrão (mensagem do usuário + legenda da planilha); usados só para exibição
const HTIMES={
  H01:'06:50–14:40', H02:'08:10–16:00', H03:'10:10–18:00', H04:'12:10–20:00',
  H05:'13:10–21:00', H06:'14:30–22:20', H07:'15:30–23:20',
  H08:'09:00–13:00 / 15:00–19:00', H09:'09:30–19:20'
};
const MESES_PT=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const DOW_LETRA={0:'D',1:'S',2:'T',3:'Q',4:'Q',5:'S',6:'S'}; // referência

function readWorkbookAll(file){
  return new Promise((res,rej)=>{
    const r=new FileReader(), isCsv=/\.csv$/i.test(file.name);
    r.onload=()=>{ try{
      const wb = isCsv ? XLSX.read(r.result,{type:'string'}) : XLSX.read(new Uint8Array(r.result),{type:'array'});
      const out={};
      wb.SheetNames.forEach(n=>{ out[n]=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:false,defval:''}); });
      res({names:wb.SheetNames,sheets:out});
    }catch(e){rej(e);} };
    r.onerror=rej;
    if(isCsv)r.readAsText(file); else r.readAsArrayBuffer(file);
  });
}

const FLET=new Set(['F','E','R','I','A','S']);
function ehTurno(v){ return /^H\d{1,2}$/.test(v); }

// classifica os códigos de um funcionário (array de strings cruas dos dias)
function classificarDias(raw){
  const up=raw.map(v=>String(v==null?'':v).trim().toUpperCase());
  // marca blocos de FÉRIAS: sequência (>=3) de células com 1 letra ∈ {F,E,R,I,A,S}
  const fer=up.map(()=>false);
  let i=0;
  while(i<up.length){
    if(up[i].length===1 && FLET.has(up[i])){
      let j=i; while(j<up.length && up[j].length===1 && FLET.has(up[j])) j++;
      if(j-i>=3){ for(let k=i;k<j;k++) fer[k]=true; }
      i=j;
    } else i++;
  }
  return up.map((v,idx)=>{
    if(fer[idx]) return {c:'FÉRIAS',t:'ferias'};
    if(ehTurno(v)) return {c:v,t:'turno'};
    if(v==='*')   return {c:'*',t:'domingo'};
    if(v==='FF')  return {c:'FF',t:'feriado'};
    if(v==='FA')  return {c:'FA',t:'aniv'};
    if(v==='F')   return {c:'F',t:'folga'};
    if(v==='')    return {c:'',t:'vazio'};
    return {c:v,t:'outro'};
  });
}

// acha a linha dos números dos dias (a que tem mais inteiros 1..31 em sequência)
function acharLinhaDias(rows){
  let melhor=-1, melhorScore=0, melhorCols=null;
  for(let r=0;r<Math.min(rows.length,8);r++){
    const cols=[];
    (rows[r]||[]).forEach((v,c)=>{
      const n=parseInt(String(v).trim(),10);
      if(String(v).trim()!=='' && n>=1 && n<=31 && String(parseInt(String(v).trim(),10))===String(v).trim()) cols.push({col:c,n});
    });
    if(cols.length>melhorScore){ melhorScore=cols.length; melhor=r; melhorCols=cols; }
  }
  return melhorScore>=10 ? {row:melhor,cols:melhorCols} : null;
}

function parseEscalaMensal(rows,nomeArq){
  const diaInfo=acharLinhaDias(rows);
  if(!diaInfo) throw new Error('Não encontrei a linha com os dias do mês (1, 2, 3…). Confira se escolheu a aba certa.');
  const dayCols=diaInfo.cols;                 // [{col,n}]
  const colIdxs=dayCols.map(d=>d.col);
  const nomeCol=Math.max(0,Math.min.apply(null,colIdxs)-1); // coluna do nome = imediatamente antes dos dias
  const funcCol=Math.max(0,nomeCol-1);

  // título / mês
  let titulo='', mesNum=null;
  for(let r=0;r<=diaInfo.row;r++){
    const linha=(rows[r]||[]).map(x=>String(x).trim()).join(' ');
    const mnorm=norm(linha);
    if(mnorm.indexOf('escala')>=0 || MESES_PT.some(m=>mnorm.indexOf(m)>=0)){
      MESES_PT.forEach((m,idx)=>{ if(mnorm.indexOf(m)>=0 && mesNum===null) mesNum=idx; });
      if(!titulo) titulo=linha.replace(/\s+/g,' ').trim();
    }
  }
  // linha dos dias da semana (logo abaixo dos números), se houver
  const dowRow=rows[diaInfo.row+1]||[];
  const dias=dayCols.map(d=>{
    let dw=String(dowRow[d.col]||'').trim().toUpperCase();
    return {n:d.n, dow:dw};
  });

  // funcionários
  const funcs=[]; let funcAtual='';
  for(let r=diaInfo.row+2;r<rows.length;r++){
    const row=rows[r]||[];
    const fcell=String(row[funcCol]||'').trim();
    const nome=String(row[nomeCol]||'').trim();
    if(fcell) funcAtual=fcell;
    if(!nome) continue;
    if(nome.indexOf('=')>=0) break;                       // início da legenda (F = FOLGA…)
    if(/^H\d{1,2}\b/.test(nome.toUpperCase())) break;     // legenda de horários
    if(!/[A-Za-zÀ-ÿ]{3,}/.test(nome)) continue;           // descarta números soltos
    const raw=dayCols.map(d=>row[d.col]);
    const preenchidas=raw.filter(v=>String(v==null?'':v).trim()!=='').length;
    if(preenchidas<5) continue;
    funcs.push({func:funcAtual===nome?'':funcAtual, nome, dias:classificarDias(raw)});
  }
  if(!funcs.length) throw new Error('Não encontrei funcionários com escala nesta aba.');
  return {titulo:titulo||nomeArq, mesNum, dias, funcs, fonte:nomeArq};
}

// soma por turno de um funcionário
function tallyFunc(f){
  const t={}; let folga=0,domingo=0,ferias=0,feriado=0,aniv=0,outro=0,trab=0;
  f.dias.forEach(d=>{
    if(d.t==='turno'){ t[d.c]=(t[d.c]||0)+1; trab++; }
    else if(d.t==='folga')folga++;
    else if(d.t==='domingo'){domingo++;trab++;}
    else if(d.t==='ferias')ferias++;
    else if(d.t==='feriado')feriado++;
    else if(d.t==='aniv')aniv++;
    else if(d.t==='outro')outro++;
  });
  return {turnos:t,folga,domingo,ferias,feriado,aniv,outro,trab};
}
// união ordenada dos códigos de turno de um mês
function turnosDoMes(mes){
  const s=new Set();
  mes.funcs.forEach(f=>f.dias.forEach(d=>{ if(d.t==='turno')s.add(d.c); }));
  return Array.from(s).sort();
}

/* ---------- importação: escolher aba → confirmar → salvar ---------- */
async function importarEscalaMensal(file){
  const prog=modalProgresso('Lendo '+file.name);
  let wbAll;
  try{ wbAll=await readWorkbookAll(file); }
  catch(e){ closeModal(); toast('Não consegui abrir o Excel','err'); return; }
  closeModal();
  // qual aba? tenta achar a que parece escala do mês; senão deixa escolher
  const candidatas=wbAll.names.filter(n=>{
    try{ const p=parseEscalaMensal(wbAll.sheets[n],file.name); return p.funcs.length>0; }catch(e){ return false; }
  });
  const escolher=(nome)=>{
    let p; try{ p=parseEscalaMensal(wbAll.sheets[nome],file.name); }
    catch(e){ toast(e.message,'err'); return; }
    confirmarEscalaMensal(p,file.name);
  };
  if(candidatas.length===1){ escolher(candidatas[0]); return; }
  const lista=(candidatas.length?candidatas:wbAll.names);
  const preferida=candidatas.find(n=>{ const mn=norm(n); return MESES_PT.some((m,i)=>mn.indexOf(m.slice(0,3))>=0); })||lista[0];
  openModal('Escolher a aba do mês','ti-table',
    '<p class="hint" style="margin-top:0">O arquivo tem várias abas. Escolha a do mês que você quer importar.</p>'
    +'<div class="f-wrap"><label class="f" for="abaSel">Aba</label><select id="abaSel">'
    +lista.map(n=>'<option'+(n===preferida?' selected':'')+'>'+esc(n)+'</option>').join('')+'</select></div>'
    +(candidatas.length?'<p class="hint" style="margin:10px 0 0">Abas que parecem escala já vêm filtradas.</p>':''),
    '<button class="btn btn-ghost btn-sm" type="button" onclick="closeModal()">Cancelar</button>'
    +'<button class="btn btn-primary btn-sm" id="abaOk" type="button"><i class="ti ti-arrow-right" aria-hidden="true"></i> Ler aba</button>');
  $('#abaOk').onclick=()=>{ const n=$('#abaSel').value; closeModal(); escolher(n); };
}

    +p.funcs.map(f=>'<tr><td>'+esc(f.func||'—')+'</td><td>'+esc(f.nome)+'</td><td class="num">'+f.dias.filter(d=>d.t!=='vazio').length+'</td></tr>').join('')

  openModal('Confirmar importação','ti-calendar-check',body,

  };

/* ---------- cadastrar os funcionários da planilha no app ----------
   Cria as categorias (função da planilha), os turnos H01..H09 com os
   horários oficiais e um funcionário por linha, usando o turno em que
   a pessoa mais trabalhou no mês como turno padrão. Não duplica: quem
   já existe é atualizado. */
const HRANGE={
  H01:['06:50','14:40'], H02:['08:10','16:00'], H03:['10:10','18:00'], H04:['12:10','20:00'],
  H05:['13:10','21:00'], H06:['14:30','22:20'], H07:['15:30','23:20'],
  H08:['09:00','19:00'], H09:['09:30','19:20']
};
function catIdPorNome(nome){
  const alvo=norm(nome);
  let c=CATS.find(c=>norm(c.nome)===alvo);
  if(c)return c.id;
  // singular do rótulo da planilha: "BALCONISTAS" -> "Balconista"
  let bonito=nome.trim().toLowerCase().replace(/^\w/,ch=>ch.toUpperCase());
  if(/s$/i.test(bonito)&&bonito.length>3)bonito=bonito.replace(/es$/i,'').replace(/s$/i,'');
  c=CATS.find(c=>norm(c.nome)===norm(bonito));
  if(c)return c.id;
  const id=uid(); CATS.push({id,nome:bonito});
  TURNOS.forEach(t=>{ if(!MINIMOS[t.id])MINIMOS[t.id]={}; MINIMOS[t.id][id]=0; });
  return id;
}
function turnoIdPorCodigo(cod){
  let t=TURNOS.find(t=>norm(t.nome)===norm(cod)||t.id===cod);
  if(t)return t.id;
  const h=HRANGE[cod]||['00:00','00:00'];
  const id=cod; TURNOS.push({id,nome:cod,ini:h[0],fim:h[1]});
  // turno novo nasce sem exigência de cobertura: quem define o mínimo é o usuário,
  // senão a Escala diária acusaria desfalque em todo turno recém-criado
  MINIMOS[id]={}; CATS.forEach(c=>{ MINIMOS[id][c.id]=0; });
  return id;
}
// dia da semana em que a pessoa mais folga (só vira folga fixa se for padrão claro)
function folgasFixas(f,mes,ano){
  const cont={};
  f.dias.forEach((d,i)=>{
    if(d.t!=='folga')return;
    const wd=new Date(ano,mes,i+1).getDay();
    cont[wd]=(cont[wd]||0)+1;
  });
  const out=[];
  Object.keys(cont).forEach(wd=>{ if(cont[wd]>=3)out.push(+wd); });  // 3+ vezes no mesmo dia = fixo
  return out;
}
function cadastrarFuncsDoMes(mes){
  const prev=[];
  mes.funcs.forEach(f=>{
    const t=tallyFunc(f);
    const cods=Object.keys(t.turnos).sort((a,b)=>t.turnos[b]-t.turnos[a]);
    const principal=cods[0]||'';
    const existe=FUNCS.find(x=>norm(x.nome)===norm(f.nome));
    prev.push({f,t,principal,folgas:folgasFixas(f,mes.mesNum,mes.ano),existe:!!existe});
  });
  const novos=prev.filter(p=>!p.existe).length, atualiza=prev.length-novos;
  let body='<p class="hint" style="margin-top:0">De <b>'+esc(mes.nome)+'</b>: <b>'+novos+'</b> funcionário(s) novo(s)'
    +(atualiza?' e <b>'+atualiza+'</b> já cadastrado(s) que serão atualizados':'')+'.</p>'
    +'<p class="hint" style="margin:0 0 12px">O <b>turno padrão</b> é aquele em que a pessoa mais trabalhou no mês. A <b>folga fixa</b> só é marcada quando cai no mesmo dia da semana pelo menos 3 vezes — na sua escala a folga é rodiziada, então é normal ficar em branco.</p>'
    +'<div class="tbl-wrap scroll-y" style="max-height:40vh"><table class="mini-tbl"><thead><tr>'
    +'<th style="width:34px"><span class="sr-only">Incluir</span></th><th>Nome</th><th>Função</th><th>Turno padrão</th><th>Folga fixa</th></tr></thead><tbody>';
  prev.forEach((p,i)=>{
    body+='<tr><td><input type="checkbox" class="cdUsar" data-i="'+i+'" checked aria-label="Cadastrar '+esc(p.f.nome)+'"></td>'
      +'<td>'+esc(p.f.nome)+(p.existe?' <span class="tag gray">já existe</span>':'')+'</td>'
      +'<td>'+esc(p.f.func||'—')+'</td>'
      +'<td>'+(p.principal?esc(p.principal)+' <span class="muted">'+(HTIMES[p.principal]||'')+'</span>':'<span class="muted">sem turno (férias)</span>')+'</td>'
      +'<td>'+(p.folgas.length?p.folgas.map(d=>DOW_S[d]).join(', '):'<span class="muted">—</span>')+'</td></tr>';
  });
  body+='</tbody></table></div>';
  openModal('Cadastrar funcionários','ti-user-plus',body,
    '<button class="btn btn-ghost btn-sm" type="button" onclick="closeModal()">Cancelar</button>'
    +'<button class="btn btn-primary btn-sm" id="cdOk" type="button"><i class="ti ti-check" aria-hidden="true"></i> Cadastrar</button>');
  $('#cdOk').onclick=()=>{
    let criados=0,atualizados=0;
    $$('.cdUsar').forEach(c=>{
      if(!c.checked)return;
      const p=prev[+c.dataset.i];
      const catId=p.f.func?catIdPorNome(p.f.func):(CATS[0]?CATS[0].id:catIdPorNome('Geral'));
      const turnoId=p.principal?turnoIdPorCodigo(p.principal):(TURNOS[0]?TURNOS[0].id:turnoIdPorCodigo('H01'));
      const t=turnoOf(turnoId)||{ini:'',fim:''};
      const ja=FUNCS.find(x=>norm(x.nome)===norm(p.f.nome));
      if(ja){
        ja.catId=catId; ja.turnoId=turnoId; ja.entrada=t.ini; ja.saida=t.fim;
        if(p.folgas.length)ja.folgas=p.folgas.slice();
        atualizados++;
      }else{
        FUNCS.push({id:uid(),nome:p.f.nome,catId,turnoId,entrada:t.ini,saida:t.fim,
          folgas:p.folgas.slice(),horaExtra:false,folgaFeriado:false,saldoInicial:0});
        criados++;
      }
    });
    if(!criados&&!atualizados){ toast('Ninguém selecionado','err'); return; }
    ensureMinimos(); saveAll();
    // turnos antigos que ninguém usa mais só atrapalham a cobertura mínima
    const orfaos=TURNOS.filter(t=>!FUNCS.some(f=>f.turnoId===t.id));
    if(orfaos.length&&TURNOS.length>orfaos.length&&
       confirm('Cadastro concluído.\n\nSobrou(ram) '+orfaos.length+' turno(s) que ninguém usa ('+orfaos.map(t=>t.nome).join(', ')+').\n\nRemover?')){
      orfaos.forEach(t=>{ delete MINIMOS[t.id]; });
      TURNOS=TURNOS.filter(t=>FUNCS.some(f=>f.turnoId===t.id));
      saveAll();
    }
    closeModal(); selectTab('func');
    toast(criados+' cadastrado(s)'+(atualizados?' · '+atualizados+' atualizado(s)':''),'ok');
  };
}

function ligarDropMensal(){
  const drop=$('#menDrop'), file=$('#menFile');
  if(!drop)return;
  drop.onclick=()=>file.click();
  drop.onkeydown=e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); file.click(); } };
  file.onchange=e=>{ if(e.target.files[0])importarEscalaMensal(e.target.files[0]); file.value=''; };
  ['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('over');}));
  ['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('over');}));
  drop.addEventListener('drop',e=>{ const f=e.dataTransfer.files[0]; if(f)importarEscalaMensal(f); });
}

function baixarContagemCSV(mes){
  const turnos=turnosDoMes(mes);
  const head=['Funcao','Nome',...turnos,'Folgas','Domingos','Ferias','FolgaFeriado','FolgaAniversario','DiasTrabalhados'];
  const linhas=[head.join(';')];
  mes.funcs.forEach(f=>{
    const t=tallyFunc(f);
    linhas.push([f.func||'', f.nome, ...turnos.map(x=>t.turnos[x]||0), t.folga,t.domingo,t.ferias,t.feriado,t.aniv,t.trab]
      .map(v=>{ const s=String(v); return /[;"\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; }).join(';'));
  });
  const blob=new Blob(['﻿'+linhas.join('\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='contagem-turnos-'+norm(mes.nome).replace(/\W+/g,'-')+'.csv'; a.click(); URL.revokeObjectURL(a.href);
  toast('CSV baixado','ok');
}

   Lê PDF (camada de texto), XML de NF-e, texto/CSV e imagem (OCR),

   importar. O arquivo em si não é guardado — só os itens extraídos,
